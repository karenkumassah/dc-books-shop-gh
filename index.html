.nosplash #splash{display:none}
.shelf{align-items:flex-end}.shelf span{width:16px;border-radius:3px 3px 0 0;background:var(--on);transform-origin:bottom}.shelf span:nth-child(1){height:44px}.shelf span:nth-child(2){height:58px;background:var(--tint)}.shelf span:nth-child(3){height:38px}.shelf span:nth-child(4){height:52px;background:var(--tint)}
.sp .logo{width:96px;height:96px;font-size:38px;margin:0 auto 16px;animation:logoIn .9s cubic-bezier(.2,1.4,.4,1) both}
.sp h2{margin:0;font-size:clamp(22px,6vw,34px);animation:up .7s ease .5s both}

.shelf{margin-top:22px;font-size:34px;display:flex;gap:14px;justify-content:center}
.shelf span{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}

.bump{animation:bump .4s ease}.add.ok{background:var(--ok);border-color:var(--ok)}

.login{position:fixed;inset:0;background:rgba(5,15,40,.6);display:grid;place-items:center;padding:16px;z-index:5}
.login[hidden]{display:none}
.box{background:var(--card);border-radius:16px;padding:20px;width:min(380px,100%);display:flex;flex-direction:column;gap:10px}

.empty{text-align:center;color:var(--mut);padding:40px 0}

  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvent=e;});
  function closeInstall(saveChoice){var layer=document.getElementById('home-install');if(layer)layer.hidden=true;if(saveChoice){try{localStorage.setItem('dc-home-install-dismissed','1')}catch(e){}}}
  function showInstall(){
    try{if(localStorage.getItem('dc-home-install-dismissed'))return}catch(e){}
    if(document.getElementById('home-install'))return;
    var html='<div class="install-layer" id="home-install" role="dialog" aria-modal="true" aria-labelledby="install-title"><section class="install-card"><button class="install-close" type="button" aria-label="Close">×</button><div class="install-art" aria-hidden="true"><span class="install-star one">✦</span><span class="install-star two">✧</span><span class="install-book">📘</span><span class="install-pencil">✏️</span></div><h2 id="install-title">Keep DC Books close</h2><p class="install-copy">Pin our shop to your home screen for quick access to books, stationery and more.</p><button class="btn install-action" type="button">Pin to Home Screen</button><p class="install-help">On iPhone or iPad, tap Share, then “Add to Home Screen.” On Android, open your browser menu and choose “Add to Home screen” or “Install app.”</p><button class="install-later" type="button">Maybe later</button></section></div>';
    document.body.insertAdjacentHTML('beforeend',html);
    var layer=document.getElementById('home-install'),action=layer.querySelector('.install-action'),help=layer.querySelector('.install-help'),copy=layer.querySelector('.install-copy');
    if(location.protocol!=='https:'){copy.textContent='To pin DC Books, open the public HTTPS site on your phone.';help.textContent='Home-screen pinning needs the public HTTPS website. Open the GitHub Pages link on your phone, then use your browser menu to add it to your Home Screen.'}
    layer.addEventListener('click',function(e){if(e.target===layer){closeInstall(true)}});
    layer.querySelector('.install-close').addEventListener('click',function(){closeInstall(true)});
    layer.querySelector('.install-later').addEventListener('click',function(){closeInstall(true)});
    action.addEventListener('click',async function(){
      if(installEvent){installEvent.prompt();try{await installEvent.userChoice}catch(e){}installEvent=null;closeInstall(true);return}
      help.classList.add('show');action.textContent='Got it';action.onclick=function(){closeInstall(true)};
    });
    layer.querySelector('.install-close').focus();
  }
  window.addEventListener('appinstalled',function(){closeInstall(true)});
  window.setTimeout(showInstall,3000);
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('./service-worker.js').catch(function(){})})}
})();
</script></body></html>
